<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Payout state machine</title>
<style>
.th{font:500 14px sans-serif;fill:#0c0c0a;}.ts{font:400 12px sans-serif;fill:#6b6a63;}
.c-amber rect{fill:#faeeda;stroke:#854f0b;}.c-amber .th{fill:#633806;}.c-amber .ts{fill:#854f0b;}
.c-blue rect{fill:#e6f1fb;stroke:#185fa5;}.c-blue .th{fill:#0c447c;}.c-blue .ts{fill:#185fa5;}
.c-red rect{fill:#fcebeb;stroke:#a32d2d;}.c-red .th{fill:#791f1f;}.c-red .ts{fill:#a32d2d;}
.c-green rect{fill:#eaf3de;stroke:#3b6d11;}.c-green .th{fill:#27500a;}.c-green .ts{fill:#3b6d11;}
.c-gray rect{fill:#f1efe8;stroke:#5f5e5a;}.c-gray .th{fill:#2c2c2a;}.c-gray .ts{fill:#5f5e5a;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g class="c-amber"><rect x="260" y="30" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">pending</text>
<text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Funds held · awaiting worker</text></g>
<line x1="340" y1="86" x2="340" y2="156" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="122" dominant-baseline="central">worker picks up</text>
<path d="M260 58 L140 58 L140 230" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.6"/>
<text class="ts" x="175" y="50" text-anchor="middle">cancel</text>
<g class="c-blue"><rect x="240" y="156" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="177" text-anchor="middle" dominant-baseline="central">processing</text>
<text class="ts" x="340" y="195" text-anchor="middle" dominant-baseline="central">Bank call in progress</text></g>
<path d="M440 184 L560 184 L560 280 L500 280" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="516" y="175" text-anchor="middle">success (70%)</text>
<path d="M240 184 L120 184 L120 280 L180 280" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="155" y="175" text-anchor="middle">fail (20%)</text>
<path d="M440 172 L560 172 L560 42 L420 42" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.5"/>
<text class="ts" x="576" y="110" text-anchor="start">hang → retry 30s</text>
<g class="c-red"><rect x="100" y="258" width="160" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="280" text-anchor="middle" dominant-baseline="central">failed</text>
<text class="ts" x="180" y="298" text-anchor="middle" dominant-baseline="central">Funds refunded</text>
<text class="ts" x="180" y="314" text-anchor="middle" dominant-baseline="central">Atomic with state change</text></g>
<g class="c-green"><rect x="420" y="258" width="160" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="280" text-anchor="middle" dominant-baseline="central">completed</text>
<text class="ts" x="500" y="298" text-anchor="middle" dominant-baseline="central">Debit entry created</text>
<text class="ts" x="500" y="314" text-anchor="middle" dominant-baseline="central">Terminal — no exit</text></g>
<g class="c-gray"><rect x="60" y="202" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="224" text-anchor="middle" dominant-baseline="central">cancelled</text>
<text class="ts" x="130" y="242" text-anchor="middle" dominant-baseline="central">Funds released</text></g>
<text class="ts" x="340" y="352" text-anchor="middle" fill="#E24B4A">Illegal: completed → any · failed → completed · cancelled → any</text>
</svg>
