<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Playto Payout Engine — Architecture Overview</title>
<style>
.box{fill:#f1efe8;stroke:#b4b2a9;}.th{font:500 14px sans-serif;fill:#0c0c0a;}.ts{font:400 12px sans-serif;fill:#6b6a63;}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56;}.c-teal .th{fill:#085041;}.c-teal .ts{fill:#0f6e56;}
.c-purple rect{fill:#eeedfe;stroke:#534ab7;}.c-purple .th{fill:#3c3489;}.c-purple .ts{fill:#534ab7;}
.c-blue rect{fill:#e6f1fb;stroke:#185fa5;}.c-blue .th{fill:#0c447c;}.c-blue .ts{fill:#185fa5;}
.c-coral rect{fill:#faece7;stroke:#993c1d;}.c-coral .th{fill:#712b13;}.c-coral .ts{fill:#993c1d;}
.c-amber rect{fill:#faeeda;stroke:#854f0b;}.c-amber .th{fill:#633806;}.c-amber .ts{fill:#854f0b;}
.c-green rect{fill:#eaf3de;stroke:#3b6d11;}.c-green .th{fill:#27500a;}.c-green .ts{fill:#3b6d11;}
line.arr{stroke:#888780;stroke-width:0.5;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-teal">
<rect x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">React dashboard</text>
<text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Polls every 5 seconds</text>
</g>
<line x1="340" y1="86" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="430" y="110" dominant-baseline="central">POST /api/v1/payouts/</text>
<g class="c-purple">
<rect x="200" y="126" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Django + DRF API</text>
<text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">Idempotency · SELECT FOR UPDATE · Atomic writes</text>
</g>
<line x1="200" y1="154" x2="130" y2="154" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="162" y="144" text-anchor="middle">Lock + write</text>
<line x1="480" y1="154" x2="550" y2="154" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="517" y="144" text-anchor="middle">Enqueue job</text>
<g class="c-blue">
<rect x="40" y="126" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="148" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts" x="120" y="166" text-anchor="middle" dominant-baseline="central">Ledger · Payouts · Keys</text>
</g>
<g class="c-coral">
<rect x="550" y="126" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="600" y="148" text-anchor="middle" dominant-baseline="central">Redis</text>
<text class="ts" x="600" y="166" text-anchor="middle" dominant-baseline="central">Job broker</text>
</g>
<line x1="340" y1="182" x2="340" y2="270" class="arr" marker-end="url(#arrow)"/>
<rect x="80" y="270" width="520" height="100" rx="12" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.5"/>
<text class="th" x="340" y="295" text-anchor="middle" dominant-baseline="central">Celery workers</text>
<g class="c-amber">
<rect x="100" y="305" width="180" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="325" text-anchor="middle" dominant-baseline="central">process_payout</text>
<text class="ts" x="190" y="343" text-anchor="middle" dominant-baseline="central">70% success · 20% fail · 10% hang</text>
</g>
<g class="c-amber">
<rect x="400" y="305" width="180" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="325" text-anchor="middle" dominant-baseline="central">retry_stuck_payouts</text>
<text class="ts" x="490" y="343" text-anchor="middle" dominant-baseline="central">Every 30 seconds · max 3 tries</text>
</g>
<line x1="600" y1="182" x2="600" y2="330" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="600" y1="330" x2="582" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="120" y1="370" x2="120" y2="410" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="120" y1="410" x2="60" y2="410" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="60" y1="410" x2="60" y2="182" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="60" y1="182" x2="40" y2="182" class="arr" marker-end="url(#arrow)"/>
<g class="c-green">
<rect x="210" y="420" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="440" text-anchor="middle" dominant-baseline="central">deliver_webhook</text>
<text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central">HMAC signed · 5 retries · exponential backoff</text>
</g>
<line x1="280" y1="370" x2="280" y2="420" class="arr" marker-end="url(#arrow)"/>
</svg>
